<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="퍼블릭100 파주 활동기록 움직이는 지도" />
  <title>퍼블릭100 움직이는 활동지도</title>
  <style>
    :root{--navy:#17345f;--green:#3e8b55;--lime:#f2fae9;--pink:#e85b92;--paper:#fffafd}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Pretendard,"Noto Sans KR",sans-serif;color:var(--navy);background:linear-gradient(135deg,#fff 8%,#fbf8ff 48%,#fff4fa 100%)}
    main{width:min(100%,1100px);margin:auto;padding:24px;min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;align-items:center}
    .stage{position:relative;aspect-ratio:1575/999;min-height:460px;border-radius:32px;overflow:hidden;background:#fff;box-shadow:0 24px 70px rgba(49,31,77,.09);border:1px solid rgba(255,255,255,.85)}
    canvas{position:absolute;z-index:1;inset:0;width:100%;height:100%;mix-blend-mode:multiply;pointer-events:none}.heading{position:absolute;z-index:3;top:24px;left:28px;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.78);backdrop-filter:blur(8px)}.heading h1{font-size:clamp(1.1rem,2.4vw,1.7rem);margin:0 0 4px}.heading p{margin:0;font-size:.88rem;color:#5e6a80}
    .marker{position:absolute;z-index:4;width:46px;height:46px;border:0;border-radius:50%;background:rgba(232,91,146,.75);color:#183d79;font-weight:800;font-size:.92rem;cursor:pointer;box-shadow:0 0 0 0 rgba(232,91,146,.42);animation:pulse 2.4s ease-out infinite;transform:translate(-50%,-50%);transition:.25s}
    .marker:hover,.marker:focus-visible,.marker.active{scale:1.14;background:rgba(232,91,146,.92);outline:3px solid rgba(255,255,255,.9)}
    .m1{left:39.4%;top:78.1%;animation-delay:0s}.m2{left:45.3%;top:71.2%;animation-delay:.5s}.m3{left:56%;top:26.1%;animation-delay:1s}.m4{left:45.1%;top:61.1%;animation-delay:1.5s}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,91,146,.45)}70%{box-shadow:0 0 0 20px rgba(232,91,146,0)}100%{box-shadow:0 0 0 0 rgba(232,91,146,0)}}
    aside{padding:8px}.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.14em;color:var(--green)}h2{font-size:1.65rem;margin:8px 0 12px}.description{line-height:1.65;color:#586477;margin-bottom:24px}.detail{min-height:146px;padding:20px;border-radius:22px;background:#fff;box-shadow:0 14px 40px rgba(41,47,72,.09)}.detail b{display:block;font-size:1.15rem;margin-bottom:8px}.detail span{line-height:1.55;color:#657084}
    .controls{margin-top:18px;display:grid;gap:14px}.control-row{display:grid;grid-template-columns:72px 1fr 38px;gap:10px;align-items:center;font-size:.86rem;font-weight:700}.control-row output{text-align:right;color:#62708a}input[type=range]{accent-color:var(--pink);width:100%}
    .legend{margin-top:18px;font-size:.8rem;color:#69758a;display:flex;gap:14px;flex-wrap:wrap}.key::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--pink)}.key.flow::before{background:#3574d4}
    @media(max-width:800px){main{grid-template-columns:1fr;padding:12px;gap:8px;align-items:start}.stage{min-height:420px;border-radius:24px}.heading{top:20px;left:20px}.heading p{font-size:.82rem}aside{padding:16px 8px}.marker{width:42px;height:42px}}
    @media(prefers-reduced-motion:reduce){.marker{animation:none}}
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="파주시 활동지도">
      <div class="heading"><h1 id="mapHeading">파주시 마을공동체협회 활동지도</h1><p id="mapSubtitle">파주 곳곳의 연결이 움직임이 됩니다</p></div>
      <canvas id="mapCanvas"></canvas>
      <button class="marker m1" data-name="운정1동·금촌2동" data-copy="tc1 활동기록 지점" aria-label="tc1 운정1동과 금촌2동">tc1</button>
      <button class="marker m2" data-name="금촌1동" data-copy="tc2 활동기록 지점" aria-label="tc2 금촌1동">tc2</button>
      <button class="marker m3" data-name="파평면" data-copy="tc3 활동기록 지점" aria-label="tc3 파평면">tc3</button>
      <button class="marker m4" data-name="영태리마을회관" data-copy="tc4 활동기록 지점" aria-label="tc4 영태리마을회관">tc4</button>
    </section>
    <aside>
      <div class="eyebrow">PAJU · ACTIVITY MAP</div><h2>움직이는 공동체 기록</h2>
      <p class="description">분홍색 원을 누르면 활동지역을 확인할 수 있습니다. 파란 점의 흐름은 지역 안에서 이어지는 만남과 활동을 표현합니다.</p>
      <div class="detail" aria-live="polite"><b id="place">활동지점을 선택하세요</b><span id="copy">tc1부터 tc4까지 차례로 눌러보세요.</span></div>
      <div class="controls">
        <label class="control-row"><span>움직임</span><input id="speed" type="range" min="0" max="20" value="10"><output id="speedOut">10</output></label>
        <label class="control-row"><span>점 크기</span><input id="dotSize" type="range" min="1" max="5" step=".5" value="2.5"><output id="sizeOut">2.5</output></label>
      </div>
      <div class="legend"><span class="key">활동지점</span><span class="key flow">활동의 흐름</span></div>
    </aside>
  </main>
  <script>
    document.querySelector('#mapHeading').textContent='파주시 마을공동체협회 활동지도';
    document.querySelector('#mapSubtitle').textContent='파주 곳곳의 연결이 움직임이 됩니다';
    const canvas=document.querySelector('#mapCanvas'),ctx=canvas.getContext('2d');
    const speed=document.querySelector('#speed'),dotSize=document.querySelector('#dotSize');
    const speedOut=document.querySelector('#speedOut'),sizeOut=document.querySelector('#sizeOut');
    let w=0,h=0,dpr=1;
    const outline=[[.29,.18],[.39,.11],[.48,.09],[.52,.19],[.57,.11],[.62,.17],[.63,.09],[.68,.12],[.75,.04],[.79,.11],[.76,.22],[.71,.31],[.68,.48],[.64,.55],[.67,.68],[.63,.86],[.55,.87],[.49,.82],[.44,.91],[.31,.96],[.30,.78],[.27,.68],[.29,.54],[.27,.47],[.30,.39],[.27,.30]];
    function path(){ctx.beginPath();outline.forEach(([x,y],i)=>i?ctx.lineTo(x*w,y*h):ctx.moveTo(x*w,y*h));ctx.closePath()}
    function resize(){const r=canvas.getBoundingClientRect();dpr=devicePixelRatio||1;w=r.width;h=r.height;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
    addEventListener('resize',resize);resize();
    function draw(ms){ctx.clearRect(0,0,w,h);ctx.save();path();ctx.clip();
      const gap=Math.max(11,w/58),t=ms*.00022*Number(speed.value);for(let y=h*.1;y<h*.94;y+=gap){for(let x=w*.18;x<w*.84;x+=gap){const nx=x/w,ny=y/h;const wave=Math.sin(nx*13+t)+Math.cos(ny*15-t*.8)+Math.sin((nx+ny)*10+t*.55);const cx=.49+Math.sin(t*.42)*.07,cy=.51+Math.cos(t*.34)*.09;const dist=Math.hypot((nx-cx)*.92,(ny-cy)*1.08);const reach=.24+wave*.025;const power=Math.max(0,Math.min(1,(reach-dist)/.14));const base=.14+power*.82;ctx.beginPath();ctx.arc(x,y,Number(dotSize.value)*(0.55+power*.75),0,Math.PI*2);ctx.fillStyle=`rgba(43,105,198,${base})`;ctx.fill()}}
      ctx.restore();requestAnimationFrame(draw)}requestAnimationFrame(draw);
    document.querySelectorAll('.marker').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.marker').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.querySelector('#place').textContent=btn.dataset.name;document.querySelector('#copy').textContent=btn.dataset.copy;}));
    speed.addEventListener('input',()=>speedOut.value=speed.value);dotSize.addEventListener('input',()=>sizeOut.value=dotSize.value);
  </script>
</body>
</html>
